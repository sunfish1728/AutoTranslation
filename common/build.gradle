dependencies {
    // Compile-time only: provides Mixin and @Environment types used by the
    // client core. It is supplied by Fabric at runtime and is not bundled.
    modCompileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
}

sourceSets.main.java.exclude(
        "me/langyue/autotranslation/mixin/EntityMixin.java",
        "me/langyue/autotranslation/mixin/MinecraftServerMixin.java",
        "me/langyue/autotranslation/mixin/PlayerChatMessageMixin.java",
        "me/langyue/autotranslation/mixin/PlayerMixin.java",
        "me/langyue/autotranslation/mixin/PlayerTeamMixin.java",
        "me/langyue/autotranslation/mixin/ServerPlayerMixin.java",
        "me/langyue/autotranslation/mixin/compat/**"
)

architectury {
    common("fabric", "forge")
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
