plugins {
    id 'fabric-loom' version '1.6.12'
}

group = 'me.langyue'
version = "${mod_version}+mc${minecraft_version}-fabric"

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    implementation 'com.google.code.gson:gson:2.10.1'
}

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
sourceSets.main.java.srcDirs('../client-1201-shared/src/main/java', '../core/src/main/java')

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand version: version }
    from('../LICENSE') { into '' }
    from('../common/src/main/resources/assets/autotranslation/textures/gui/icon.png') { into 'assets/autotranslation/textures/gui' }
}

tasks.named('jar', Jar) { archiveBaseName = 'AutoTranslation' }
tasks.named('remapJar') { archiveBaseName = 'AutoTranslation' }

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
