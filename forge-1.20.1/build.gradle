plugins {
    id 'net.minecraftforge.gradle' version '6.0.24'
}

group = 'me.langyue'
version = "${mod_version}+mc${minecraft_version}-forge"

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    if (project.hasProperty('compatSmoke')) maven { url = 'https://maven.blamejared.com/' }
}

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
sourceSets.main.java.srcDirs('../client-1201-shared/src/main/java', '../core/src/main/java')

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client {
            workingDirectory project.file('run')
            if (project.hasProperty('compatSmoke')) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', file("$buildDir/compat-smoke/srg_to_official.srg").absolutePath
            }
            mods { autotranslation { source sourceSets.main } }
        }
        server { workingDirectory project.file('run-server'); mods { autotranslation { source sourceSets.main } } }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")
    implementation 'com.google.code.gson:gson:2.10.1'
    if (project.hasProperty('compatSmoke')) {
        implementation fg.deobf('vazkii.patchouli:Patchouli:1.20.1-85-FORGE')
    }
}

tasks.register('prepareCompatSmokeRefmap', Exec) {
    def defaultMapping = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/minecraft_user_repo/de/oceanlabs/mcp/mcp_config/1.20.1-20230612.114412/srg_to_official_1.20.1.tsrg')
    def mapping = project.hasProperty('compatMappings') ? file(project.property('compatMappings')) : defaultMapping
    onlyIf { project.hasProperty('compatSmoke') && mapping.isFile() }
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', file('compat-smoke/tsrg2srg.ps1'), '-Source', mapping, '-Output', file("$buildDir/compat-smoke/srg_to_official.srg")
}
tasks.matching { it.name == 'prepareRunClient' }.configureEach { dependsOn tasks.named('prepareCompatSmokeRefmap') }

tasks.named('jar', Jar) {
    archiveBaseName = 'AutoTranslation'
    manifest.attributes([
            'Specification-Title': 'AutoTranslation',
            'Specification-Vendor': '墨涤千尘',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'MixinConfigs': 'autotranslation.forge.mixins.json,autotranslation.forge.patchouli.mixins.json'
    ])
}

tasks.named('processResources', ProcessResources) {
    from('../LICENSE') { into '' }
    from('../common/src/main/resources/assets/autotranslation/textures/gui/icon.png') { into 'assets/autotranslation/textures/gui' }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
