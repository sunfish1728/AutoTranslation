name: Four production JARs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mc1.20.1-fabric
            java: 17
            root: fabric-1.20.1
            tasks: clean remapJar
            jar: AutoTranslation-1.3.0+mc1.20.1-fabric.jar
            metadata: fabric.mod.json
          - name: mc1.20.1-forge
            java: 17
            root: forge-1.20.1
            tasks: clean build
            jar: AutoTranslation-1.3.0+mc1.20.1-forge.jar
            metadata: META-INF/mods.toml
          - name: mc1.21.1-neoforge
            java: 21
            root: neoforge-1.21.1
            tasks: clean build
            jar: AutoTranslation-1.3.0+mc1.21.1-neoforge.jar
            metadata: META-INF/neoforge.mods.toml
          - name: mc26.1.2-neoforge
            java: 25
            root: neoforge-26.1.2
            tasks: clean build
            jar: AutoTranslation-1.3.0+mc26.1.2-neoforge.jar
            metadata: META-INF/neoforge.mods.toml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrappers
        run: chmod +x gradlew neoforge-26.1.2/gradlew

      - name: Test pure core
        if: matrix.name == 'mc1.20.1-fabric'
        run: ./gradlew -p core test --no-daemon

      - name: Build production JAR
        run: |
          if [ "${{ matrix.root }}" = "neoforge-26.1.2" ]; then
            chmod +x neoforge-26.1.2/gradlew
            neoforge-26.1.2/gradlew -p neoforge-26.1.2 ${{ matrix.tasks }} --no-daemon
          else
            chmod +x gradlew
            ./gradlew -p "${{ matrix.root }}" ${{ matrix.tasks }} --no-daemon
          fi

      - name: Verify production contents
        shell: bash
        run: |
          set -euo pipefail
          jar_path="${{ matrix.root }}/build/libs/${{ matrix.jar }}"
          test -f "$jar_path"
          entries="$(unzip -Z1 "$jar_path")"
          grep -Fx '${{ matrix.metadata }}' <<<"$entries"
          grep -Fx 'LICENSE' <<<"$entries" || grep -Fx 'META-INF/LICENSE' <<<"$entries"
          grep -Fx 'me/langyue/autotranslation/translate/ITranslator.class' <<<"$entries"
          grep -Fx 'me/langyue/autotranslation/translate/TranslatorManager.class' <<<"$entries"
          if grep -Eiq 'architectury|PlatformMethods|MinecraftServerMixin|ServerPlayerMixin|PlayerChatMessageMixin' <<<"$entries"; then
            echo 'Forbidden runtime or server entry found in production JAR' >&2
            exit 1
          fi
          duplicates="$(sort <<<"$entries" | uniq -d)"
          test -z "$duplicates"
          sha256sum "$jar_path" > "${jar_path}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoTranslation-${{ matrix.name }}
          path: |
            ${{ matrix.root }}/build/libs/${{ matrix.jar }}
            ${{ matrix.root }}/build/libs/${{ matrix.jar }}.sha256
          if-no-files-found: error
